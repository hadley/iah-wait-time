on:
  workflow_dispatch:
  push:
  schedule:
    # Every 10 minutes, around the clock (avoids DST issues with UTC cron)
    - cron: "*/10 * * * *"

name: scrape

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out data
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Scrape
        run: Rscript 1-scrape.R

      - name: Collapse
        run: Rscript 2-collapse.R

      - name: Build site
        run: Rscript 3-build.R

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

      - name: Commit and push data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Data from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
