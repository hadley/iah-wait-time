on:
  workflow_dispatch:
  push:
  schedule:
    # Every 10 minutes, around the clock (avoids DST issues with UTC cron)
    - cron: "*/10 * * * *"

name: scrape

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Normal runs take ~1-2 min; fail fast so a hung run doesn't block the queue
    timeout-minutes: 8
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out data
        uses: actions/checkout@v5
        with:
          ref: data
          path: data

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2

      - name: Scrape
        run: Rscript 1-scrape.R

      - name: Collapse
        run: Rscript 2-collapse.R

      - name: Build site
        run: Rscript 3-build.R

      - name: Deploy to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push -f "https://x-access-token:${GITHUB_PAT}@github.com/${{ github.repository }}.git" gh-pages

      - name: Commit and push data
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Data from ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push
